{% extends "base.html" %}

{% block title %}Register · DevVault{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md py-12">
        <div class="rounded-xl border border-slate-800 bg-slate-900 p-8">
            <h1 class="text-2xl font-bold text-slate-100">Create an account</h1>
            <p class="mt-1 text-sm text-slate-400">Join DevVault.</p>

            <form method="post" class="mt-6 space-y-5">
                {% csrf_token %}
                {% include "partials/form_fields.html" %}
                <button type="submit"
                        class="w-full rounded-md bg-emerald-500 px-4 py-2 font-medium text-slate-950 transition hover:bg-emerald-400">
                    Register
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-400">
                Already have an account?
                <a href="{% url 'accounts:login' %}" class="font-medium text-emerald-400 hover:text-emerald-300">Login</a>
            </p>
        </div>
    </div>
{% endblock %}
